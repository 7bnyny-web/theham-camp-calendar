<title>더함캠프 홍보 캘린더</title>
<style>
/* VOICE: 아이폰 기본 캘린더처럼 조용하고 익숙하게

:root{color-scheme:light;--bg:#fbfaf9;--ink:#1d1d1f;--mute:#8a8580;--line:rgba(60,60,67,.14);--red:#ff3b30;--accent:#ff3b30;

--up-t:#0058c7;--make-t:#8a2fb8;--shoot-t:#a85700;--ask-t:#007a8f;--prep-t:#55555a;--camp-t:#1d7d3a;

body.lock{overflow:hidden}

.bar-top{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 6px max(16px,env(safe-area-inset-left));max-width:820px;margin:0 auto}
.bar-top b{font-size:17px;font-weight:600}
.dd{font-size:15px;font-weight:600;color:var(--red);font-variant-numeric:tabular-nums}
.key{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:820px;margin:0 auto;padding:2px max(16px,env(safe-area-inset-left)) 8px;font-size:12px;font-weight:600;color:#55555a}.key::-webkit-scrollbar{display:none}

.key .ev{flex:none;font-size:12px;padding:3px 8px;letter-spacing:-.02em}.key .ev.hi{padding-right:15px}.key .ev.hi::after{top:7px;right:6px;width:6px;height:6px}
.tip{position:fixed;z-index:50;max-width:260px;padding:10px 13px;border-radius:16px;background:linear-gradient(145deg,rgba(255,255,255,.55),rgba(255,255,255,.28));-webkit-backdrop-filter:blur(14px) saturate(200%) brightness(1.05);backdrop-filter:blur(14px) saturate(200%) brightness(1.05);box-shadow:0 10px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.65);pointer-events:none;font-size:13px;line-height:1.45}
.tip b{display:block;font-size:15px;font-weight:600;margin:3px 0 2px}.tip p{margin:0;color:#4a4a4f}
.wds{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));max-width:820px;margin:0 auto;padding:2px 4px 6px}
.wds span{text-align:center;font-size:12px;color:var(--mute)}
.wds span:first-child{color:var(--red)}
main{max-width:820px;margin:0 auto;padding:0 4px calc(130px + env(safe-area-inset-bottom))}
.month{padding-top:14px}
.month h2{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 6px 10px;scroll-margin-top:120px}

.day{border:0;border-top:.5px solid var(--line);background:none;color:var(--ink);min-height:var(--rowh,94px);padding:5px 2px 4px;display:flex;flex-direction:column;align-items:stretch;gap:2px;cursor:pointer;font:inherit;text-align:left}

.pr{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--red)}
.pr::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--red)}
.pr.l::before{background:var(--mute)}
.pr.l{color:var(--mute);font-weight:500}
.rt{font-size:17px;font-weight:600;line-height:1.3;margin:0}

/* bottom toolbar */
.tools{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,rgba(251,250,249,0),rgba(251,250,249,.55) 40%,rgba(251,250,249,.7));-webkit-backdrop-filter:blur(20px) saturate(190%);backdrop-filter:blur(20px) saturate(190%);-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26px);mask-image:linear-gradient(to bottom,transparent 0,#000 26px);border:0;padding:24px max(12px,env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
.tools div{max-width:820px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
.tb{border:0;background:none;color:var(--red);font:400 17px system-ui,-apple-system,sans-serif;min-height:44px;padding:0 6px;cursor:pointer}
.tb.on{font-weight:600}
/* sheets */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.22);opacity:0;pointer-events:none}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:640px;margin:0 auto;max-height:78vh;display:flex;flex-direction:column;background:rgba(250,249,247,.82);-webkit-backdrop-filter:blur(30px) saturate(190%);backdrop-filter:blur(30px) saturate(190%);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.9);transform:translateY(105%);padding-bottom:env(safe-area-inset-bottom)}
.sheet.open{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(60,60,67,.3);margin:7px auto 0}
.sh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 16px 8px}

.opt{display:flex;align-items:center;gap:12px;padding:11px 10px;border-bottom:.5px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.opt div{flex:1}.opt b{display:block;font-size:17px;font-weight:500}.opt span{display:block;font-size:13px;color:var(--mute)}
.sw{position:relative;width:51px;height:31px;border-radius:9999px;border:0;background:rgba(120,120,128,.18);cursor:pointer;flex:none}

.edit-only{display:none}body.canedit .edit-only{display:inline-flex}
.shb{display:flex;align-items:center;gap:10px}
.fab{position:fixed;z-index:31;right:max(16px,calc((100vw - 820px)/2 + 16px));bottom:calc(106px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;align-items:center;justify-content:center;cursor:pointer;background:linear-gradient(145deg,rgba(255,255,255,.42),rgba(255,255,255,.12));-webkit-backdrop-filter:blur(18px) saturate(200%) brightness(1.05);backdrop-filter:blur(18px) saturate(200%) brightness(1.05);border:1px solid rgba(255,255,255,.75);box-shadow:0 8px 24px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(255,255,255,.3)}

.addb{border:0;background:rgba(255,59,48,.12);color:var(--red);font:600 15px system-ui,-apple-system,sans-serif;border-radius:9999px;padding:6px 14px;min-height:32px;cursor:pointer;align-items:center}
.note{margin:0 auto;max-width:820px;padding:0 16px 6px;font-size:13px;color:#a85700}

.form{padding:6px 12px 12px;display:flex;flex-direction:column;gap:12px}
.form label,.fl{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--mute)}
.form input,.form textarea{font:400 16px system-ui,-apple-system,sans-serif;color:var(--ink);background:rgba(255,255,255,.85);border:.5px solid rgba(60,60,67,.2);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
.form textarea{resize:vertical;line-height:1.45}
.seg{display:flex;flex-wrap:wrap;gap:6px}

#editSheet{height:min(86vh,760px)}

.etitle-in{display:block;width:100%;border:0;background:transparent;resize:none;overflow:hidden;font:700 26px/1.25 system-ui,-apple-system,sans-serif;letter-spacing:-.02em;color:var(--ink);padding:22px 6px 18px;margin:0}

button:focus-visible{outline:2px solid #0071e3;outline-offset:2px}

      const key = id === 'wY' ? 'y' : id === 'wM' ? 'm' : 'd';
      if (wState[key] === v) return;
      wState[key] = v;
      if (key !== 'd') { const n = daysIn(wState.y, wState.m); if ($('wD')._vals.length !== n) { wState.d = Math.min(wState.d, n); fillCol($('wD'), Array.from({length: n}, (_, i) => i + 1), x => x + '일', wState.d); } }
      syncWheel();
    }, 90);
  }, {passive: true});
  el.addEventListener('click', e => { const it = e.target.closest('.it'); if (it) el.scrollTo({top: el._vals.indexOf(+it.dataset.v) * WH, behavior: 'smooth'}); });
});

function buildSegs() {

}
async function connect() {
  if (!window.claude || !claude.use) { note('지금은 보기 전용이에요. claude.ai에 로그인하면 수정할 수 있어요.'); return; }
  const [u, d] = await Promise.all([claude.use('user'), claude.use('db')]);
  db = d;
  if (!db) { note('지금은 보기 전용이에요. claude.ai에 로그인하면 수정할 수 있어요.'); return; }
  let w = null; try { w = u ? await u.can('data.write') : null; } catch (e) {}
  canWrite = w !== false;
  document.body.classList.toggle('canedit', canWrite);
  const timer = setTimeout(() => note('일정을 불러오는 중이에요. 연결이 느리면 잠시 뒤 다시 열어 주세요.'), 10000);
  db.collection('events').onSnapshot(snap => {
    if (!snap.metadata.fromCache) { clearTimeout(timer); note(''); }
    live = true;
    setData(snap.docs.map(x => ({id: x.id, ...x.data()})));
    if (!snap.metadata.fromCache && snap.empty) note('아직 일정이 없어요. + 버튼으로 추가해 주세요.');
  }, err => { clearTimeout(timer); note('일정을 불러오지 못했어요. 지금은 저장된 기본 일정을 보여 드려요.'); live = false; setData(FALLBACK); });
}

document.documentElement.classList.add('snap');
function applyZoom(z, anchor) {
  zoom = Math.min(2.6, Math.max(1, z));
  const before = anchor ? anchor.getBoundingClientRect().top : 0;
  document.documentElement.style.setProperty('--rowh', Math.round(94 * zoom) + 'px');
  const ex = zoom > 1.3, lvl = zoom > 1.75;
  if (ex !== zoomed || lvl !== (applyZoom.lvl || false)) { applyZoom.lvl = lvl; zoomed = ex; document.body.classList.toggle('detail', lvl); document.body.classList.toggle('zoomed', zoomed); }
  if (anchor) window.scrollBy(0, anchor.getBoundingClientRect().top - before);
}
const cell = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest('.day[data-d]'); };
let pinch = null;
const vc = $('view-cal');
vc.addEventListener('touchstart', e => {
  if (e.touches.length === 2) {
    const [a, b] = e.touches;
    pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), z: zoom, anchor: cell((a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2)};
    document.documentElement.classList.remove('snap');
  }
}, {passive: true});
vc.addEventListener('touchmove', e => {
  if (pinch && e.touches.length === 2) {
    e.preventDefault();
    const [a, b] = e.touches;
    pinch.next = pinch.z * Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY) / pinch.d;
    if (!pinch.raf) pinch.raf = requestAnimationFrame(() => { if (!pinch) return; pinch.raf = 0; applyZoom(pinch.next, pinch.anchor); });
  }
}, {passive: false});
const endPinch = () => { if (!pinch) return; pinch = null; try { localStorage.setItem('theham-zoom', zoom); } catch(e) {} requestAnimationFrame(() => document.documentElement.classList.toggle('snap', view === 'cal')); };
vc.addEventListener('touchend', e => { if (e.touches.length < 2) endPinch(); });

['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault(), {passive: false}));
let wheelT = null;
window.addEventListener('wheel', e => {
  if (!e.ctrlKey || view !== 'cal') return;
  e.preventDefault();
  document.documentElement.classList.remove('snap');
  applyZoom(zoom * Math.exp(-e.deltaY / 200), cell(e.clientX, e.clientY));
  clearTimeout(wheelT); wheelT = setTimeout(() => { try { localStorage.setItem('theham-zoom', zoom); } catch(_) {} document.documentElement.classList.add('snap'); }, 250);
}, {passive: false});
document.body.classList.toggle('zoomed', zoomed);

applyZoomInit(); if (zoomed) cal();
